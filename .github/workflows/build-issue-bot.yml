# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Build Issue Bot"

on:
  pull_request:
    paths:
      - 'issue-bot/**'
      - '.github/workflows/build-issue-bot.yml'
  push:
    branches:
      - "2.3.x"
    paths:
      - 'issue-bot/**'
      - '.github/workflows/build-issue-bot.yml'

concurrency:
  group: build-issue-bot-${{ github.head_ref || github.run_id }} # will be canceled on subsequent pushes in pull requests but not branches
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-issue-bot:
    name: "Build Issue Bot"

    runs-on: "ubuntu-latest"
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        script:
          - "../bin/phpstan"
          - "vendor/bin/phpunit"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: "Install PHP"
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # 2.37.2
        with:
          coverage: "none"
          php-version: "8.5"

      - uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0

      - name: "Install issue-bot dependencies"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0
        with:
          working-directory: "issue-bot"

      - name: "Tests"
        working-directory: "issue-bot"
        run: ${{ matrix.script }}
